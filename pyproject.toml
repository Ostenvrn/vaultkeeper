# ============================================
# Конфиг ruff — линтер и форматтер Python-кода
# ============================================

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "venv", "__pycache__", "build", "dist", "snapshots", "logs"]

[tool.ruff.lint]
# E/W — pycodestyle, F — pyflakes, I — isort, B — bugbear, UP — pyupgrade
# S — bandit (частично отключён ниже, чтобы не ругался на subprocess в наших утилитах)
select = ["E", "W", "F", "I", "B", "UP", "S"]

# Объяснение отключений:
# E501 — длина строки (проверяется formatter'ом)
# S101 — assert (нужен в тестах)
# S603 — subprocess без shell=True (нам не нужно, у нас фиксированные команды)
# S607 — subprocess с относительным путём (git, docker — всегда в PATH)
# S110 — try/except/pass (иногда это ок для необязательных операций)
ignore = ["E501", "S101", "S603", "S607", "S110"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "F401"]
"test_*.py" = ["S101", "F401"]
